<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>若安zzh-留言板</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="box">
    <div class="container">
        <div class="left">
            <div class="tit">留言建议</div>
            <div class="item">
                <input type="text" placeholder="请输入你的昵称" class="name">
            </div>
            <div class="item">
                <textarea placeholder="请输入留言内容" class="text"></textarea>
            </div>
            <div class="btn">
                <button class="clear">清空</button>
                <button class="OK">提交</button>
            </div>
        </div>
        <div class="right">
            <div class="tit">留言板</div>
            <div class="list"></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
